# The config the README gives: one folder per document type, with the
# package's styles read from the tree instead of a sync.
StylesPath = Diataxis/styles
MinAlertLevel = suggestion

[{fixtures,fixtures/clean}/tutorial.md]
BasedOnStyles = Tutorial

[{fixtures,fixtures/clean}/howto.md]
